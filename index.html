    <style>
        :root {
            /* 60-30-10 Design Tokens */
            --brand-navy: #0A192F;
            /* 60% - Primary/Sidebar */
            --brand-navy-accent: #112240;
            --brand-gray: #F8FAFC;
            /* 30% - Sections/Cards */
            --brand-gray-dark: #E2E8F0;
            --brand-blue: #0066FF;
            /* 10% - CTAs/Action */
            --brand-blue-glow: rgba(0, 102, 255, 0.15);

            /* Status Colors */
            --verification-green: #10B981;
            /* Calm Green */
            --error-red: #EF4444;
            --warning-orange: #F59E0B;

            /* Typography & Shadows */
            --text-navy: #0F172A;
            --text-slate: #475569;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-xl: 1.25rem;
            --radius-2xl: 1.5rem;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--brand-gray);
            color: var(--text-navy);
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* SaaS Structure & High Trust Cards */
        .glass-card {
            background: #FFFFFF !important;
            backdrop-filter: none !important;
            border: 1px solid var(--brand-gray-dark) !important;
            box-shadow: var(--shadow-sm) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            color: var(--text-navy) !important;
        }

        .glass-card:hover {
            box-shadow: var(--shadow-lg) !important;
            border-color: var(--brand-blue) !important;
            transform: translateY(-2px);
        }

        /* Primary SaaS Buttons */
        .btn-primary {
            background-color: var(--brand-blue) !important;
            color: #FFFFFF !important;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 700;
            text-transform: none !important;
            letter-spacing: normal !important;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 var(--brand-blue-glow);
        }

        .btn-primary:hover {
            background-color: #0052CC !important;
            box-shadow: 0 6px 20px 0 var(--brand-blue-glow);
            transform: scale(1.01);
        }

        .btn-secondary {
            background-color: #FFFFFF !important;
            color: var(--text-slate) !important;
            border: 1px solid var(--brand-gray-dark) !important;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: var(--brand-gray) !important;
            color: var(--text-navy) !important;
            border-color: var(--brand-blue) !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--brand-gray);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--brand-gray-dark);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--brand-blue);
        }
    </style>
